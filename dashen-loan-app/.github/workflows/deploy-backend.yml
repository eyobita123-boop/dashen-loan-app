name: Deploy Backend

on:
  push:
      branches: [main]
          paths: ['backend/**']

          jobs:
            deploy:
                runs-on: ubuntu-latest
                    steps:
                          - uses: actions/checkout@v3
                                - uses: actions/setup-node@v3
                                        with:
                                                  node-version: 18
                                                            cache: 'npm'
                                                                      cache-dependency-path: backend/package-lock.json
                                                                            - name: Install dependencies
                                                                                    run: |
                                                                                              cd backend
                                                                                                        npm ci
                                                                                                              - name: Generate Prisma Client
                                                                                                                      run: |
                                                                                                                                cd backend
                                                                                                                                          npx prisma generate
                                                                                                                                                - name: Build
                                                                                                                                                        run: |
                                                                                                                                                                  cd backend
                                                                                                                                                                            npm run build
                                                                                                                                                                                  - name: Deploy to Railway (or your preferred host)
                                                                                                                                                                                          env:
                                                                                                                                                                                                    RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                      npx railway up --service=dashen-loan-backend