version: '3.9'
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashen
      POSTGRES_PASSWORD: dashen
      POSTGRES_DB: dashen_loan
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dashen:dashen@db:5432/dashen_loan
      JWT_SECRET: your-super-secret-jwt-key
      PORT: '5000'
      NODE_ENV: development
    ports:
      - '5000:5000'
    depends_on:
      - db
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev

  frontend:
    image: node:18-alpine
    working_dir: /usr/src/app
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '5173:5173'
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  db_data:
